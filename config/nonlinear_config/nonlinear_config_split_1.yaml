functions:
  torch:
    attention:
      - softmax
    ffn:
      - silu
      - gelu
      - fast_gelu
  vlp:
    attention:
      - softmax
    ffn:
      - silu
      - gelu
      - fast_gelu
  taylor:
    attention:
      - softmax
params:
  vlp:
    attention:
      exp_dim: [8, 9, 10, 11, 12]
      max_exp: [4]
      min_exp: [-2, -1, 0, 1, 2]
      window_size: [256]
      lut_build: ['min']
    ffn:
      exp_dim: [8, 9, 10, 11, 12]
      max_pos_exp: [4]
      min_pos_exp: [-8, -7, -6, -5, -4, -3, -2, -1, 0, 1, 2]
      window_size: [256]
      lut_build: ['min']
  taylor:
    attention:
      degree_center: [-9, -8, -7, -6, -5, -4, -3, -2, -1, 0]
      degrees: [6, 7, 8, 9, 10]